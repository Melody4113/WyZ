<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>專業證照｜Professional Certifications</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5fb;color:#25314c;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}main{max-width:1100px;margin:auto;padding:24px 20px 70px}.hero{background:linear-gradient(125deg,#e7e8ff,#fff 56%,#e8f4fa);border:1px solid #e4e4f2;border-radius:25px;padding:64px 7%;position:relative;overflow:hidden}.hero:after{content:'✧';position:absolute;right:8%;top:15%;font-size:140px;color:#c2b9f4;opacity:.35}.eyebrow{letter-spacing:.22em;font-size:12px;color:#6e70a5;font-weight:700}.hero h1{font-family:Georgia,'Noto Serif TC',serif;font-size:clamp(35px,6vw,60px);margin:17px 0 12px}.hero p{color:#64708a;line-height:1.9;max-width:620px}.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}.stat{padding:12px 20px;background:#ffffffb8;border:1px solid #fff;border-radius:13px;font-size:13px;color:#626d89}.stat b{color:#5554a3;font-size:22px;margin-right:8px}.intro{margin:46px 0 25px}.intro h2{font-family:Georgia,'Noto Serif TC',serif;font-size:28px;margin:0 0 8px}.intro p{color:#748098;font-size:14px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:25px}.tabs button{border:1px solid #dcdff0;background:white;color:#64708c;padding:10px 15px;border-radius:99px;cursor:pointer;font-size:13px}.tabs button.active{background:#515c9a;color:white;border-color:#515c9a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.cert{background:#fff;border:1px solid #e4e6f0;border-radius:19px;padding:23px;box-shadow:0 8px 24px #24264d08;display:flex;flex-direction:column;min-height:205px}.cert .top{display:flex;justify-content:space-between;gap:12px}.category{font-size:11px;color:#777ab3;letter-spacing:.08em;font-weight:700}.symbol{font-family:Georgia,serif;font-size:28px;color:#b5a7e5}.cert h3{font-size:19px;margin:15px 0 12px;line-height:1.5}.cert .detail{font-size:13px;line-height:1.8;color:#78849a;margin-top:auto}.cert .number{border-top:1px solid #eef0f5;margin-top:14px;padding-top:12px;font-size:12px;color:#8a93a7;overflow-wrap:anywhere}.footer{margin-top:38px;border-top:1px solid #dedfed;padding-top:20px;color:#8b92a8;font-size:12px;text-align:center}.hidden{display:none!important}@media(max-width:650px){main{padding:12px 12px 45px}.hero{padding:43px 24px}.hero:after{right:-20px;font-size:95px}.grid{grid-template-columns:1fr}.cert{min-height:175px}.hero h1{font-size:36px}}</style></head><body><main><section class="hero"><div class="eyebrow">QUALIFICATIONS & ACHIEVEMENTS</div><h1>專業證照<span style="color:#8a82c8">.</span></h1><p>從資訊技術、AI 應用到醫學資訊與健康照護，透過不同領域的學習與檢定，持續累積專業知識與實作能力。</p><div class="stats"><div class="stat"><b>10</b>項證照與技能認證</div><div class="stat"><b>5</b>大專業領域</div></div></section><section class="intro"><div class="eyebrow">CERTIFICATE COLLECTION</div><h2>證照一覽</h2><p>依專業領域分類，點選下方標籤即可篩選。</p></section><nav class="tabs" aria-label="證照分類"><button class="active" data-filter="all">全部證照</button><button data-filter="ai">AI 與資料應用</button><button data-filter="it">資訊技術</button><button data-filter="medical">醫學資訊</button><button data-filter="business">行銷與文書</button><button data-filter="care">急救技能</button></nav><div class="grid" id="cards"></div><div class="footer">PROFESSIONAL CERTIFICATIONS · PERSONAL PORTFOLIO</div></main><script>const items=[['ai','GenAI 輔助資料擷取與分析（Python 3）','',''],['ai','生成式 AI 應用與技術','',''],['it','電腦軟體應用乙級','技術士證','118-0177332'],['it','電腦軟體應用丙級','技術士證','118-0889526'],['it','電腦硬體裝修丙級','技術士證','120-0290340'],['it','網頁設計丙級','技術士證','173-0230689'],['medical','醫學資訊管理師','醫資證管','1131字第167號'],['business','TIMS 行銷專業能力認證合格證書','',''],['business','MOCC 中文看打輸入丙級','中華民國電腦教育發展協會',''],['care','急救技能 CPR + AED 合格','','']];const labels={ai:'AI & DATA',it:'INFORMATION TECHNOLOGY',medical:'MEDICAL INFORMATICS',business:'BUSINESS & OFFICE',care:'FIRST AID'};document.getElementById('cards').innerHTML=items.map(([cat,name,issuer,no])=>`<article class="cert" data-cat="${cat}"><div class="top"><span class="category">${labels[cat]}</span><span class="symbol">✦</span></div><h3>${name}</h3><div class="detail">${issuer||'專業能力認證'}</div>${no?`<div class="number">證號　${no}</div>`:''}</article>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-cat]').forEach(c=>c.classList.toggle('hidden',b.dataset.filter!=='all'&&c.dataset.cat!==b.dataset.filter))}));</script></body></html>
